name: khoroch_diary
description: "Khoroch Diary — Smart Digital Khata. An offline-first personal finance ledger (Plan · Track · Save)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Local persistence uses Drift. Supabase remains opt-in and is not configured.
dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # Tests only: MockClient (http/testing) fakes the Supabase HTTP transport in
  # test/supabase_cloud_backend_test.dart. lib/ no longer imports package:http.
  http: ^1.6.0
flutter:
  uses-material-design: true
  assets:
    - assets/category_icons/
    - assets/illustrations/
    - assets/notes/
    - assets/onboarding/
    - lib/features/ledger/data/schema.sql
